<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Shard Protocol Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cross-Shard Protocol Visualization</h1>
            <p class="subtitle">Block flow comparison: Baseline (13 blocks) vs 2PC Matrix (4 blocks)</p>
        </header>

        <nav class="tabs">
            <button class="tab-button active" data-tab="comparison">Comparison</button>
            <button class="tab-button" data-tab="baseline">Baseline Detail</button>
            <button class="tab-button" data-tab="twopc">2PC Detail</button>
        </nav>

        <div class="content">
            <!-- Comparison Tab (default) -->
            <div id="comparison-tab" class="tab-content active">
                <div class="svg-container">
                    <svg id="comparison-svg"></svg>
                </div>
                <div class="controls">
                    <button id="comparison-play" class="btn btn-primary">Play</button>
                    <button id="comparison-pause" class="btn">Pause</button>
                    <button id="comparison-step" class="btn">Step</button>
                    <button id="comparison-reset" class="btn">Reset</button>
                    <div class="speed-control">
                        <label>Speed:</label>
                        <input type="range" id="comparison-speed" min="0.5" max="3" step="0.1" value="1">
                        <span id="comparison-speed-value">1.0x</span>
                    </div>
                </div>
            </div>

            <!-- Baseline Detail Tab -->
            <div id="baseline-tab" class="tab-content">
                <div class="svg-container">
                    <svg id="baseline-svg"></svg>
                </div>
                <div class="controls">
                    <button id="baseline-play" class="btn btn-primary">Play</button>
                    <button id="baseline-pause" class="btn">Pause</button>
                    <button id="baseline-step" class="btn">Step</button>
                    <button id="baseline-reset" class="btn">Reset</button>
                    <div class="speed-control">
                        <label>Speed:</label>
                        <input type="range" id="baseline-speed" min="0.5" max="3" step="0.1" value="1">
                        <span id="baseline-speed-value">1.0x</span>
                    </div>
                </div>
                <div class="info-panel" id="baseline-info">
                    <p>Click <strong>Play</strong> or <strong>Step</strong> to start the animation</p>
                </div>
            </div>

            <!-- 2PC Detail Tab -->
            <div id="twopc-tab" class="tab-content">
                <div class="svg-container">
                    <svg id="twopc-svg"></svg>
                </div>
                <div class="controls">
                    <button id="twopc-play" class="btn btn-primary">Play</button>
                    <button id="twopc-pause" class="btn">Pause</button>
                    <button id="twopc-step" class="btn">Step</button>
                    <button id="twopc-reset" class="btn">Reset</button>
                    <div class="speed-control">
                        <label>Speed:</label>
                        <input type="range" id="twopc-speed" min="0.5" max="3" step="0.1" value="1">
                        <span id="twopc-speed-value">1.0x</span>
                    </div>
                </div>
                <div class="info-panel" id="twopc-info">
                    <p>Click <strong>Play</strong> or <strong>Step</strong> to start the animation</p>
                </div>
            </div>
        </div>

        <footer>
            <p>TravelAgency.bookTrainAndHotel() &rarr; Train.checkSeat() &rarr; Hotel.checkRoom()</p>
        </footer>
    </div>

    <script src="comparison.js"></script>
    <script src="baseline.js"></script>
    <script src="twopc.js"></script>
    <script>
        // Tab switching
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
            });
        });

        // Speed display updates
        ['comparison', 'baseline', 'twopc'].forEach(id => {
            const slider = document.getElementById(id + '-speed');
            const display = document.getElementById(id + '-speed-value');
            if (slider && display) {
                slider.addEventListener('input', e => {
                    display.textContent = parseFloat(e.target.value).toFixed(1) + 'x';
                });
            }
        });
    </script>
</body>
</html>
