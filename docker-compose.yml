version: '3.8'

services:
  shard-orch:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: shard-orch
    environment:
      - PORT=8080
      - BYTECODE_STORE_PATH=/data/bytecode
    ports:
      - "8080:8080"
    volumes:
      - orchestrator-bytecode:/data/bytecode
      - ./config:/config
    networks:
      - sharding-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  shard-0:
    build:
      context: .
      dockerfile: Dockerfile.shard
    container_name: shard-0
    environment:
      - SHARD_ID=0
      - PORT=8545
      - ORCHESTRATOR_URL=http://shard-orch:8080
    ports:
      - "8545:8545"
    volumes:
      - ./config:/config
      - ./storage/test_statedb/0:/storage/test_statedb/0:rw
    depends_on:
      shard-orch:
        condition: service_healthy
    networks:
      - sharding-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8545/health"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s

  shard-1:
